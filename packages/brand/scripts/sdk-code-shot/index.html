<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Remotion SDK — code shot</title>
		<link rel="stylesheet" href="/monaco/vs/editor/editor.main.css" />
		<style>
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #131414;
			}
			.tab-bar {
				height: 64px;
				border-bottom: 1px solid #2b2b2b;
				background: #181919;
				display: flex;
				align-items: center;
				padding: 0 30px;
				gap: 14px;
				font:
					22px system-ui,
					sans-serif;
				color: #d4d4d4;
			}
			.typescript {
				color: #569cd6;
				font-size: 19px;
				font-weight: 600;
			}
			#editor {
				width: 100%;
				height: calc(100% - 64px);
			}
		</style>
	</head>
	<body>
		<div class="tab-bar">
			<span class="typescript">TS</span><span>editor.tsx</span>
		</div>
		<div id="editor"></div>
		<script src="/monaco/vs/loader.js"></script>
		<script src="/dark-plus-monaco.js"></script>
		<script>
			require.config({paths: {vs: '/monaco/vs'}});
			require(['vs/editor/editor.main'], async () => {
				const {code: value, tokens} = await (
					await fetch('/snippet.json')
				).json();
				window.installDarkPlus(monaco, tokens);
				window.sdkEditor = monaco.editor.create(
					document.getElementById('editor'),
					{
						value,
						language: 'remotion-dark-plus',
						theme: 'remotion-dark-plus',
						automaticLayout: true,
						minimap: {enabled: false},
						fontFamily: 'Menlo, Monaco, Consolas, monospace',
						fontSize: 50,
						lineHeight: 76,
						fontLigatures: false,
						lineNumbers: 'on',
						lineNumbersMinChars: 2,
						lineDecorationsWidth: 20,
						glyphMargin: false,
						folding: false,
						renderLineHighlight: 'none',
						renderWhitespace: 'none',
						guides: {indentation: false, bracketPairs: false},
						bracketPairColorization: {enabled: false},
						matchBrackets: 'never',
						occurrencesHighlight: 'off',
						selectionHighlight: false,
						scrollBeyondLastLine: false,
						scrollbar: {vertical: 'hidden', horizontal: 'hidden'},
						padding: {top: 40, bottom: 80},
						contextmenu: false,
						quickSuggestions: false,
						hover: {enabled: false},
						ariaLabel: 'Remotion SDK and code-mod imports',
					},
				);
				await monaco.editor.colorize(value, 'remotion-dark-plus', {});
				await document.fonts.ready;
				requestAnimationFrame(() =>
					requestAnimationFrame(() => {
						window.sdkEditorReady = true;
						document.body.dataset.captureReady = 'true';
					}),
				);
			});
		</script>
	</body>
</html>
