on:
  push:
    branches:
      - main
    paths:
      - 'packages/compositor/ffmpeg/**'
      - '.github/workflows/ffmpeg.yml'
      - '.circleci/config.yml'
  pull_request:
    paths:
      - 'packages/compositor/ffmpeg/**'
      - '.github/workflows/ffmpeg.yml'
      - '.circleci/config.yml'
  workflow_dispatch:
name: Build FFmpeg

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/compositor/ffmpeg/build

env:
  FORCE_COLOR: 1
jobs:
  build:
    name: Build on macOS ARM64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: node ../download.mjs buildInputs
      - name: Install deps
        run: HOMEBREW_INSTALL_FROM_API=1 brew install yasm nasm pkg-config cmake make meson ninja libtool autoconf automake
      - name: Install Rust
        run: |
          curl -sSfo "$RUNNER_TEMP/rustup-init" https://static.rust-lang.org/rustup/archive/1.29.3/aarch64-apple-darwin/rustup-init
          echo "63752a1919a3a4793173ec70f8f212621a7ce38ba6a246095984482f4de20f9f  $RUNNER_TEMP/rustup-init" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y
      - run: rm -f /opt/homebrew/opt/libx11/lib/libX11.6.dylib
      - run: node clean.mjs
      - run: node compile-ffmpeg.mjs
      - run: node generate-bindings.mjs
      - run: node zip.mjs
      - run: node test-ffmpeg.mjs
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-apple-darwin.gz
          path: packages/compositor/ffmpeg/build/ffmpeg.tar.gz
  build-macos-x64:
    name: Build on macOS x64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: node ../download.mjs buildInputs
      - name: Install deps
        run: HOMEBREW_INSTALL_FROM_API=1 brew install yasm nasm pkg-config cmake make meson ninja libtool autoconf automake
      - name: Install Rust
        run: |
          curl -sSfo "$RUNNER_TEMP/rustup-init" https://static.rust-lang.org/rustup/archive/1.29.3/x86_64-apple-darwin/rustup-init
          echo "bc107f1fb0228de7fa32413c89c1b305cea9cd256e94b01150cd054128145429  $RUNNER_TEMP/rustup-init" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y
      - run: node clean.mjs
      - run: node compile-ffmpeg.mjs
      - run: node generate-bindings.mjs
      - run: node zip.mjs
      - run: node test-ffmpeg.mjs
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-apple-darwin.gz
          path: packages/compositor/ffmpeg/build/ffmpeg.tar.gz
