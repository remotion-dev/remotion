on:
  push:
    branches:
      - main
  pull_request:
name: Install and Test

concurrency:
  group: install-and-test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: 1
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_NO_UPDATE_NOTIFIER: 1
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
  TURBO_SCM_HEAD: ${{ github.sha }}
jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Determine affected tests
    outputs:
      plan: ${{ steps.query.outputs.plan }}
      lambda: ${{ steps.query.outputs.lambda }}
      nextjs: ${{ steps.query.outputs.nextjs }}
      browser: ${{ steps.query.outputs.browser }}
      webrenderer: ${{ steps.query.outputs.webrenderer }}
      ssr: ${{ steps.query.outputs.ssr }}
      templates: ${{ steps.query.outputs.templates }}
      build: ${{ steps.query.outputs.build }}
      build_matrix: ${{ steps.query.outputs.build_matrix }}
      bundle_example: ${{ steps.query.outputs.bundle_example }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: 1.3.3
      - name: Query Turborepo task graph and create CI plan
        id: query
        run: bun .github/scripts/ci.ts plan

  lambda-tests:
    needs: affected
    if: ${{ needs.affected.outputs.lambda == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: Lambda integration tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: 1.3.3
      - name: Install
        run: bun ci
      - name: Cache Turbo
        uses: rharkor/caching-for-turbo@v2.3.11
      - name: Test Lambda IT
        run: |
          bun run testlambda
      - name: IT tests
        timeout-minutes: 10
        run: |
          cd packages/it-tests && bun test src/lambda src/cloudrun --run
      - name: Lambda tests
        timeout-minutes: 10
        run: |
          cd packages/lambda && bunx remotion browser ensure && bun test src/test/integration --run
  lambda-tests-required:
    needs: [affected, lambda-tests]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    name: Lambda integration
    steps:
      - name: Verify Lambda integration result
        env:
          RESULT: ${{ needs.lambda-tests.result }}
        run: |
          if [[ "$RESULT" != "success" && "$RESULT" != "skipped" ]]; then
            echo "Lambda integration tests concluded with $RESULT."
            exit 1
          fi
          echo "Lambda integration tests concluded with $RESULT."
  nextjs-tests:
    needs: affected
    if: ${{ needs.affected.outputs.nextjs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Next.js SSR build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: 1.3.3
      - name: Install
        run: bun ci
      - name: Cache Turbo
        uses: rharkor/caching-for-turbo@v2.3.11
      - name: Build Next.js SSR app
        timeout-minutes: 10
        run: |
          bun run testnextjs
  browser-tests:
    needs: affected
    if: ${{ needs.affected.outputs.browser == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    name: Browser tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: 1.3.3
      - name: Install
        run: bun ci
      - name: Install deps
        run: cd packages/webcodecs && bunx playwright install --with-deps
      - name: Cache Turbo
        uses: rharkor/caching-for-turbo@v2.3.11
      - name: Test Webcodecs
        run: |
          bun run testwebcodecs
      - name: Install E2E deps
        run: cd packages/example && bunx playwright install --with-deps
      - name: Test Example E2E
        run: |
          bun run teste2e
  webrenderer-tests:
    needs: affected
    if: ${{ needs.affected.outputs.webrenderer == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    name: Web renderer tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: 1.3.3
      - name: Install
        run: bun ci
      - name: Install deps
        run: cd packages/web-renderer && bunx playwright install --with-deps && cd ../media && bunx playwright install --with-deps
      - name: Cache Turbo
        uses: rharkor/caching-for-turbo@v2.3.11
      - name: Test web renderer
        run: |
          bun run testwebrenderer
      - name: Test Browser Studio
        run: |
          bun run testbrowserstudio
  ssr-tests:
    needs: affected
    if: ${{ needs.affected.outputs.ssr == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: SSR + Monorepo tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 16
      - uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: 1.3.3
      - name: Install
        run: bun ci
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.1'
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
      - run: pip install pylint boto3 pytest
      - name: Cache Turbo
        uses: rharkor/caching-for-turbo@v2.3.11
      - name: Test SSR
        timeout-minutes: 8
        run: |
          bun run testssr
      - name: Monorepo checks
        timeout-minutes: 10
        run: |
          cd packages/it-tests && bun test src/monorepo --run --timeout 40000
  ssr-tests-required:
    needs: [affected, ssr-tests]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    name: SSR + Monorepo checks
    steps:
      - name: Verify SSR and monorepo result
        env:
          RESULT: ${{ needs.ssr-tests.result }}
        run: |
          if [[ "$RESULT" != "success" && "$RESULT" != "skipped" ]]; then
            echo "SSR and monorepo tests concluded with $RESULT."
            exit 1
          fi
          echo "SSR and monorepo tests concluded with $RESULT."
  template-tests:
    name: Template integration on ${{ matrix.os }}
    needs: affected
    if: ${{ needs.affected.outputs.templates == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      BUN_INSTALL_CACHE_DIR: ${{ matrix.os == 'windows-latest' && 'D:\.bun\install\cache' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: 1.3.3
      - name: Cache Bun dependencies (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v5
        with:
          path: D:\.bun\install\cache
          key: ${{ matrix.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ matrix.os }}-bun-
      - name: Install
        run: bun ci
      - name: Cache Turbo
        uses: rharkor/caching-for-turbo@v2.3.11
      - name: Test templates
        timeout-minutes: 20
        run: |
          bun run testtemplates
  lint:
    needs: affected
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Linting + Formatting
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: 1.3.3
      - name: Install
        run: bun ci
        env:
          CI: true
      - name: Cache Turbo
        uses: rharkor/caching-for-turbo@v2.3.11
      - name: Perform stylecheck
        timeout-minutes: 10
        run: |
          bunx turbo run lint formatting ${{ github.event_name == 'pull_request' && '--affected' || '' }} --no-update-notifier
          bun run checkskills
      - name: Test CI planning contract
        run: bun test ./.github/scripts/ci.test.ts
  build:
    name: Build Node ${{ matrix.node_version }} on ${{ matrix.os }}
    needs: affected
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.affected.outputs.build_matrix || '{"include":[{"os":"ubuntu-latest","node_version":16,"run_build":true},{"os":"windows-latest","node_version":16,"run_build":true},{"os":"macos-latest","node_version":25,"run_build":true}]}') }}
    env:
      BUN_INSTALL_CACHE_DIR: ${{ matrix.os == 'windows-latest' && 'D:\.bun\install\cache' || '' }}
      RUN_BUILD: ${{ matrix.run_build && needs.affected.outputs.build == 'true' }}
      RUN_BUNDLE: ${{ needs.affected.outputs.bundle_example == 'true' }}
      RUN_BUILD_JOB: ${{ (matrix.run_build && needs.affected.outputs.build == 'true') || (matrix.os == 'ubuntu-latest' && needs.affected.outputs.bundle_example == 'true') }}
    steps:
      - name: No affected build tasks
        if: env.RUN_BUILD_JOB != 'true'
        run: echo "No build tasks are affected."
      - if: env.RUN_BUILD_JOB == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - if: env.RUN_BUILD_JOB == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
      - if: env.RUN_BUILD_JOB == 'true'
        uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: 1.3.3
      - name: Cache Bun dependencies (Windows)
        if: env.RUN_BUILD_JOB == 'true' && matrix.os == 'windows-latest'
        uses: actions/cache@v5
        with:
          path: D:\.bun\install\cache
          key: ${{ matrix.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ matrix.os }}-bun-
      - name: Install
        if: env.RUN_BUILD_JOB == 'true'
        run: bun ci
      - name: Cache Turbo
        if: env.RUN_BUILD_JOB == 'true'
        uses: rharkor/caching-for-turbo@v2.3.11
      - name: Build & Test
        if: env.RUN_BUILD == 'true'
        timeout-minutes: 30
        run: |
          bunx turbo run make test ${{ github.event_name == 'pull_request' && '--affected' || '' }} --concurrency=1 --no-update-notifier
      - name: Bundle example
        if: matrix.os == 'ubuntu-latest' && env.RUN_BUNDLE == 'true'
        run: |
          bunx turbo run bundle-testbed --filter=@remotion/example --no-update-notifier
  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - affected
      - lint
      - build
      - lambda-tests
      - nextjs-tests
      - browser-tests
      - webrenderer-tests
      - ssr-tests
      - template-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: 1.3.3
      - name: Validate required CI results
        env:
          CI_PLAN: ${{ needs.affected.outputs.plan }}
          CI_RESULTS: >-
            {"detector":"${{ needs.affected.result }}","lint":"${{ needs.lint.result }}","build_job":"${{ needs.build.result }}","lambda":"${{ needs.lambda-tests.result }}","nextjs":"${{ needs.nextjs-tests.result }}","browser":"${{ needs.browser-tests.result }}","webrenderer":"${{ needs.webrenderer-tests.result }}","ssr":"${{ needs.ssr-tests.result }}","templates":"${{ needs.template-tests.result }}"}
        run: bun .github/scripts/ci.ts validate
