name: Affine group visibility qualification
on:
  push:
    branches: [codex/affine-group-visibility]
permissions:
  contents: read
jobs:
  pixels:
    if: github.repository == 'alec-watts/remotion'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        producer: [baseline, candidate]
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select producer
        run: |
          mkdir -p packages/web-renderer/test/__results__
          if [ '${{ matrix.producer }}' = baseline ]; then
            git restore --source=cc7879e13f7dc5ef33d8d735ffee33c94e983b47 -- packages/web-renderer/src/drawing/process-node.ts
          fi
          git diff cc7879e13f7dc5ef33d8d735ffee33c94e983b47 -- packages/web-renderer/src/drawing > packages/web-renderer/test/__results__/producer.patch
          shasum -a 256 packages/web-renderer/src/test/mask-image.test.tsx packages/web-renderer/src/test/fixtures/mask-image.tsx > packages/web-renderer/test/__results__/test-hashes.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: bunx turbo run make --filter=@remotion/web-renderer
      - run: cd packages/web-renderer && bun run lint
      - run: cd packages/web-renderer && bunx playwright install --with-deps chromium firefox webkit
      - run: cd packages/web-renderer && bunx vitest src/test/mask-image.test.tsx --run --reporter=default --reporter=json --outputFile=./test/__results__/affine-visibility.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: affine-visibility-${{ matrix.os }}-${{ matrix.producer }}
          path: |
            packages/web-renderer/test/__results__/
            packages/web-renderer/src/test/__screenshots__/native-pixel-failures/
          retention-days: 7
          if-no-files-found: error
